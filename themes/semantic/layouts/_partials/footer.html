<section style="display:flex;flex-direction:column;gap:0.5rem;align-items:center">
  <img width="60rem" src="{{ "favicon.svg" | relURL }}">
  <strong>Semantic CSS</strong>
  <small>Copyright (c) {{ now.Year }} Gustavo Calvo</small>
</section>
<section>
  <small>
    <strong>Documentation</strong>
    <ul>
      {{- with site.GetPage "/docs" }}
        {{- range .RegularPagesRecursive }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{- end }}
      {{- end }}
    </ul>
  </small>
</section>
<section>
  <small>
    <strong>Project</strong>
    <ul>
      <li><a href="https://github.com/tavocg/semantic" target="_blank" rel="noopener noreferrer">Source code</a></li>
    </ul>
  </small>
</section>

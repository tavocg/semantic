<div style="display:flex;flex-direction:column;gap:0.5rem;align-items:center">
  <img width="60" src="{{ (resources.Get "favicon.svg").RelPermalink }}" alt="">
  <strong>Semantic CSS</strong>
  <small class="mute">Copyright (c) {{ now.Year }} Gustavo Calvo</small>
</div>
<div style="font-size:small">
    <strong>Documentation</strong>
    <ul class="mute">
      {{- with site.GetPage "/docs" }}
        {{- range .Pages }}
          <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{- end }}
      {{- end }}
    </ul>
</div>
<div style="font-size:small">
    <strong>Project</strong>
    <ul class="mute">
      {{- range site.Menus.footer }}
      <li><a href="{{ .URL }}"{{ if (urls.Parse .URL).IsAbs }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
</div>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{ if .IsHome }}{{ .Title }}{{ with site.Params.slogan }} — {{ . }}{{ end }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
<link rel="canonical" href="{{ .Permalink }}">
{{ if site.Params.injectfavicon }}
  {{ with resources.Get "favicon.svg" }}
    <link rel="icon" href="{{ printf "data:image/svg+xml;base64,%s" (.Content | base64Encode) | safeURL }}">
  {{ end }}
  <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
{{ else }}
  <link rel="icon" href="{{ "favicon.ico" | relURL }}">
{{ end }}
{{ partial "head/social.html" . }}
{{ partialCached "head/css.html" . }}

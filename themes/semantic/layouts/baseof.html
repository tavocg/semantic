<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}"{{ with site.Language.Direction }} dir="{{ . }}"{{ end }}{{ with .Param "theme" }} data-theme="{{ . }}"{{ end }}>
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ block "aside" . }}{{ end }}
    <header>
      {{ partial "header.html" . }}
    </header>
    <main{{ if .IsHome }} style="width:100%;padding:0"{{ end }}>
      {{ block "main" . }}{{ end }}
    </main>
    {{ block "footer" . }}
    <footer>
      {{ partial "footer.html" . }}
    </footer>
    {{ end }}
  </body>
</html>

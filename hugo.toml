baseURL = 'https://tavocg.github.io/semantic/'
locale = 'en-us'
title = 'Semantic'

theme = 'semantic'

[params]
description = 'A drop-in, beautiful, hand-crafted stylesheet for semantic HTML.'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup]
  [markup.highlight]
    style = 'github-dark'

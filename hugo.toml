baseURL = 'https://tavocg.github.io/semantic/'
locale = 'en-us'
title = 'Semantic'

theme = 'semantic'

[menus]
  [[menus.main]]
    name = 'Docs'
    params = { icon = 'docs' }
    pageRef = '/docs'
    weight = 20
  [[menus.main]]
    name = 'Examples'
    params = { icon = 'examples' }
    pageRef = '/examples'
    weight = 25
  [[menus.main]]
    name = 'GitHub'
    params = { icon = 'github' }
    url = 'https://github.com/tavocg/semantic'
    weight = 30
  [[menus.footer]]
    name = 'Examples'
    pageRef = '/examples'
    weight = 10
  [[menus.footer]]
    name = 'Source code'
    url = 'https://github.com/tavocg/semantic'
    weight = 20
  [[menus.footer]]
    name = 'License'
    url = 'https://raw.githubusercontent.com/tavocg/semantic/refs/heads/main/LICENSE'
    weight = 30

[params]
inject = true
injectFavicon = true
description = 'A drop-in, beautiful, hand-crafted stylesheet for semantic HTML.'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup]
  [markup.highlight]
    style = 'github-dark'

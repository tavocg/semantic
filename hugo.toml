baseURL = 'https://semantic.win/'
locale = 'en-us'
title = 'Semantic'

theme = 'semantic'
enableRobotsTXT = true

[outputFormats.markdown]
ugly = true

[[cascade]]
outputs = ['html', 'markdown']
[cascade.target]
path = '/docs/**'
kind = 'page'

[menus]
  [[menus.main]]
    name = 'Docs'
    params = { icon = 'docs' }
    pageRef = '/docs'
    weight = 20
  [[menus.main]]
    name = 'Examples'
    params = { icon = 'examples' }
    pageRef = '/examples'
    weight = 25
  [[menus.main]]
    name = 'GitHub'
    params = { icon = 'github' }
    url = 'https://github.com/tavocg/semantic'
    weight = 30
  [[menus.footer]]
    name = 'Browse all examples'
    pageRef = '/examples'
    weight = 10
  [[menus.footer]]
    name = 'Source code'
    url = 'https://github.com/tavocg/semantic'
    weight = 20
  [[menus.footer]]
    name = 'License'
    url = 'https://raw.githubusercontent.com/tavocg/semantic/refs/heads/main/LICENSE'
    weight = 30

[params]
inject = true
injectFavicon = true
description = "A drop-in, beautiful, hand-crafted stylesheet for semantic HTML under 10kB (3.4kB gz'd)."
slogan = 'Supercharge HTML'
issueTracker = 'https://github.com/tavocg/semantic/issues/new'

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup]
  [markup.highlight]
    style = 'github-dark'

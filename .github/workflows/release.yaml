name: Release

on:
  push:
    tags: ['**']

permissions:
  contents: write

env:
  HUGO_VERSION: '0.169.0'
  HUGO_ENVIRONMENT: production
  TZ: America/Costa_Rica

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: hugo --gc --minify --cleanDestinationDir --cacheDir "${RUNNER_TEMP}/hugo-cache"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s public/semantic.css
          gh release create "${GITHUB_REF_NAME}" public/semantic.css \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

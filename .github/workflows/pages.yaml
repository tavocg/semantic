name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.169.0'
  HUGO_ENVIRONMENT: production
  TZ: America/Costa_Rica

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify --cleanDestinationDir --baseURL "${PAGES_BASE_URL}/" --cacheDir "${RUNNER_TEMP}/hugo-cache"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch public/.nojekyll
          git init --initial-branch=gh-pages public
          git -C public config user.name "github-actions[bot]"
          git -C public config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C public add --all
          git -C public commit -m "Publish site"
          git -C public remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git --hostname github.com
          git -C public push --force origin gh-pages

      # Pushes made with GITHUB_TOKEN do not trigger Pages automatically.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
